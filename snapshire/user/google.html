<!DOCTYPE html>
<html>
<head>

    <title>SnapsHire Google Login Test</title>

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

</head>

<body>

    <h2>SnapsHire Google Login Test</h2>

    <div
        id="g_id_onload"
        data-client_id="479406155602-qp28tn5sf3dl8vfa6nfccnpf966sum1d.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
    </div>

    <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline">
    </div>


    <script>

        function handleCredentialResponse(response) {

            console.log("Google ID Token:");
            console.log(response.credential);

            sendTokenToBackend(response.credential);

        }


        async function sendTokenToBackend(idToken) {

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/user/google-login/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            id_token: idToken
                        })
                    }
                );

                const data = await response.json();

                console.log("Backend Response:");
                console.log(data);

            } catch (error) {

                console.error("Backend Error:");
                console.error(error);

            }

        }

    </script>

</body>
</html>
